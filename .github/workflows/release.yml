# Release build: `make release` on a v* tag, with GITHUB_TOKEN. The
# checks run first, in a job that can only read: the write permissions
# the release needs are not handed to the tools they run.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # tests make commits; CI machines have no git identity
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # secrets scan covers the whole history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.17"
      - name: Install lazygit
        run: go install github.com/jesseduffield/lazygit@v0.65.1
      - run: make ci e2e # the same checks as ci.yml: a tag never skips them

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # keyless signing (cosign) and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog from git history
          persist-credentials: false # GoReleaser publishes with GITHUB_TOKEN (API), git pushes nothing
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install cosign and syft
        run: make release-tools && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
