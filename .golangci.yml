version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # best-effort cleanup and cache writes: failures are harmless
        - os.Remove
        - os.RemoveAll
        - os.Chmod
        - os.Rename
        - (*os.File).Close
        - (*os.Root).Remove
        - (*os.Root).Close
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    presets:
      - std-error-handling
    rules:
      # tests may ignore errors of fixtures and fake servers
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
