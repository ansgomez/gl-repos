# Release build, run by GitHub Actions (`make release` on a v* tag) with
# GITHUB_TOKEN.
version: 2

project_name: gl-repos

before:
  hooks:
    - go mod tidy -diff # fails instead of rewriting go.mod/go.sum at release
    - go mod verify

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin] # needs Unix process groups; no Windows build
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, CHANGELOG.md, SECURITY.md, CONTRIBUTING.md, config.example.toml, docs/*.md, docs/demo-dark.gif, docs/demo-light.gif]

nfpms:
  - package_name: gl-repos
    vendor: gl-repos
    maintainer: Andres Gomez <8250065+ansgomez@users.noreply.github.com>
    homepage: https://github.com/ansgomez/gl-repos
    description: Terminal dashboard for every git repository under a folder; GitLab first (glab), GitHub supported (gh).
    license: MIT
    formats: [deb, rpm]
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gl-repos/LICENSE
      - src: config.example.toml
        dst: /usr/share/doc/gl-repos/config.example.toml

checksum:
  name_template: checksums.txt

# Software bill of materials for each archive (needs syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with Sigstore (needs cosign and an
# OIDC token: the GitHub id-token permission).
# Verify with the identity of the release job (docs/install.md, Verify a release): GitHub
#   --certificate-identity-regexp '^https://github\.com/ansgomez/gl-repos/\.github/workflows/release\.yml@refs/tags/v'
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    output: true

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:", Merge]

release:
  draft: false
  prerelease: auto
  footer: |
    Verify downloads: `sha256sum -c checksums.txt --ignore-missing` (macOS: `shasum -a 256 -c …`), then
    `cosign verify-blob --bundle checksums.txt.sigstore.json` with the certificate identity of this
    project's release job and its OIDC issuer, as shown in docs/install.md (Verify a release).


# Homebrew (macOS and Linux): uncomment once a tap repository exists,
# e.g. github.com/<you>/homebrew-tap, and a HOMEBREW_TAP_TOKEN secret is set.
# homebrew_casks:
#   - repository:
#       owner: <you>
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: https://github.com/<you>/gl-repos
#     description: Terminal dashboard for every git repository under a folder; GitLab first (glab), GitHub supported (gh).
#     license: MIT
